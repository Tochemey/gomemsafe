# Runs the quality bar of CONSTRAINTS.md (make check-full) on every supported Go release, and
# the benchmark. Actions are pinned to commit SHAs; Renovate keeps them current.
#
# A change that touches only Markdown skips the build. The skip is decided by the changes job,
# not by a paths filter on the trigger: a workflow that never starts leaves required checks
# pending forever. The final ci job always reports, and is the one check to require.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the GitHub API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # "code" is true when any changed file is not Markdown. Excluding what cannot affect
          # the build, instead of listing what can, means a new kind of file builds by default.
          # CONSTRAINTS.md is the exception: make deps reads its dependency allowlist.
          filters: |
            code:
              - '!**/*.md'
              - 'CONSTRAINTS.md'

  check:
    name: check (Go ${{ matrix.go }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    env:
      # Test the Go release under test, not the toolchain go.mod would switch to.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: make check-full
      # make check-full writes coverage.out; one Go release is enough for the report.
      - if: matrix.go == '1.27.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  coverage:
    name: coverage upload
    runs-on: ubuntu-latest
    needs: check
    # GitHub gives pull requests from forks no OIDC token, so their coverage is not uploaded.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # Codecov authenticates the upload with an OIDC token instead of a stored secret. Only
      # this job, which runs no project code, holds it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: true

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make bench BENCH_OUT=bench-results
      # The results table, findings included, goes into the job summary; the JSON is kept as
      # an artifact. Nothing is written back to the repository.
      - run: cat bench-results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench-results/

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [changes, check, coverage, bench]
    # Runs even when a job it needs failed or was skipped, so that it always reports a result.
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Skipped jobs pass: a Markdown-only change skips the build, and pull requests from
          # forks skip the coverage upload.
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "a required job ended with: $result" >&2
                exit 1
                ;;
            esac
          done
