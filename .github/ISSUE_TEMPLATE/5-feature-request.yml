name: Feature request
description: Suggest a new check, directive, or feature.
title: "feat: "
labels: [enhancement]
assignees: [Tochemey]
body:
  - type: markdown
    attributes:
      value: |
        Many checks are already planned: see the [check catalogue](https://github.com/Tochemey/gomemsafe/blob/main/docs/design.md#5-check-catalogue) and the [milestones](https://github.com/Tochemey/gomemsafe/blob/main/docs/design.md#10-milestones).
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - A new check
        - A directive in the annotation language
        - Output, integration, or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The bug or hazard you want caught, or what you cannot do today.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: For a check, Go code it should report and look-alike correct code it must not report.
      render: go
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What gomemsafe should do. Mention any existing tool that already does it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
